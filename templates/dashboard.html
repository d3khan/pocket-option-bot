{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <header>
        <h1>Pocket Bot</h1>
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit" class="btn-danger">Logout</button>
        </form>
    </header>
    <main>
        <section id="stats">Loading stats...</section>
        <section id="control">Loading controls...</section>
    </main>
</div>
<script>
    (function() {
        const POLL_INTERVAL_MS = 500;

        function updateUI(data) {
            // Stats
            const statsHtml = `
                <div class="stats-grid">
                    <div class="stat-card"><span>Balance: </span><span>$${data.balance.toFixed(2)}</span></div>
                    <div class="stat-card"><span>Session P/L: </span><span>$${data.total_pnl.toFixed(2)}</span></div>
                    <div class="stat-card"><span>Win Rate: </span><span>${data.win_rate}%</span></div>
                    <div class="stat-card"><span>Stake: </span><span>$${data.current_stake.toFixed(2)}</span></div>
                    <div class="stat-card"><span>Loss Streak: </span><span>${data.consecutive_losses}</span></div>
                    <div class="stat-card"><span>Asset: </span><span>${data.current_asset || "None"}</span></div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;

            // Control panel
            const running = data.running;
            const connected = data.connected;
            let buttonsHtml = '';
            if (!connected) {
                buttonsHtml = `<button onclick="connectBot()">Connect</button>`;
            } else if (connected && !running) {
                buttonsHtml = `<button onclick="startBot()">Start Bot</button>`;
            } else if (running) {
                buttonsHtml = `<button onclick="stopBot()">Stop Bot</button>`;
            }

            const controlHtml = `
                <div class="control-panel">
                    <div class="controls">${buttonsHtml}</div>
                    <div class="status-grid">
                        <div class="status-item"><span>Status:</span> <strong>${running ? "Running" : "Stopped"}</strong></div>
                        <div class="status-item"><span>Connected:</span> <strong>${connected ? "Yes" : "No"}</strong></div>
                    </div>
                </div>
            `;
            document.getElementById('control').innerHTML = controlHtml;
        }

        function fetchStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => updateUI(data))
                .catch(() => {});
        }

        // --- Actions ---
        window.startBot = function() {
            fetch('/api/start', { method: 'POST' })
                .then(() => fetchStatus());
        };
        window.stopBot = function() {
            fetch('/api/stop', { method: 'POST' })
                .then(() => fetchStatus());
        };
        window.connectBot = function() {
            fetch('/api/connect', { method: 'POST' })
                .then(() => fetchStatus());
        };

        // --- Start polling ---
        fetchStatus();
        setInterval(fetchStatus, POLL_INTERVAL_MS);
    })();
</script>
{% endblock %}

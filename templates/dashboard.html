{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <header>
        <h1>Pocket Bot</h1>
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit" class="btn-danger">Logout</button>
        </form>
    </header>
    <main>
        <section id="stats">
            Loading stats...
        </section>
        <section id="control" hx-get="/partials/control" hx-trigger="load, every 5s" hx-swap="innerHTML">
            Loading controls...
        </section>
    </main>
</div>
<script>
    // WebSocket for real-time stats
    let ws = new WebSocket(`ws://${window.location.host}/ws`);
    ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const statsHtml = `
            <div class="stats-grid">
                <div class="stat-card"><span>Balance: </span><span>$${data.balance.toFixed(2)}</span></div>
                <div class="stat-card"><span>Asset: </span><span>${data.current_asset || "None"}</span></div>
            </div>
        `;
        document.getElementById('stats').innerHTML = statsHtml;
    };
    ws.onopen = function() {
        console.log('WebSocket connected');
    };
    ws.onclose = function() {
        console.log('WebSocket disconnected, reconnecting in 1s...');
        setTimeout(() => {
            ws = new WebSocket(`ws://${window.location.host}/ws`);
        }, 1000);
    };
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <header>
        <h1>Pocket Bot</h1>
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit" class="btn-danger">Logout</button>
        </form>
    </header>
    <main>
        <section id="stats">Loading stats...</section>
        <section id="control">Loading controls...</section>
    </main>
</div>
<script>
    (function() {
        const POLL_INTERVAL_MS = 500;

        function updateUI(data) {
            // Stats
            const statsHtml = `
                <div class="stats-grid">
                    <div class="stat-card"><span>Balance: </span><span>$${data.balance.toFixed(2)}</span></div>
                    <div class="stat-card"><span>Session P/L: </span><span>$${data.total_pnl.toFixed(2)}</span></div>
                    <div class="stat-card"><span>Win Rate: </span><span>${data.win_rate}%</span></div>
                    <div class="stat-card"><span>Stake: </span><span>$${data.current_stake.toFixed(2)}</span></div>
                    <div class="stat-card"><span>Loss Streak: </span><span>${data.consecutive_losses}</span></div>
                    <div class="stat-card"><span>Asset: </span><span>${data.current_asset || "None"}</span></div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;

            // Control panel
            const connected = data.connected;
            const running = data.running;
            const ready = data.ready || false;
            const connectionStatus = data.connection_status || 'disconnected';

            let buttonsHtml = '';
            let statusMessage = '';

            if (connectionStatus === 'connecting') {
                buttonsHtml = `<button disabled>Connecting...</button>`;
                statusMessage = '⏳ Connecting to Pocket Option...';
            } else if (connectionStatus === 'failed') {
                buttonsHtml = `<button onclick="connectBot()" id="connectBtn">Connect (retry)</button>`;
                statusMessage = '❌ Connection failed. Click to retry.';
            } else if (!connected) {
                buttonsHtml = `<button onclick="connectBot()" id="connectBtn">Connect</button>`;
                statusMessage = '🔌 Not connected. Click Connect.';
            } else if (connected && !ready) {
                buttonsHtml = `<button disabled>Initializing...</button>`;
                statusMessage = '⏳ Loading assets and calculating indicators...';
            } else if (connected && ready && !running) {
                buttonsHtml = `<button onclick="startBot()" id="startBtn">Start Bot</button>`;
                statusMessage = '✅ Ready. Click Start Bot to begin trading.';
            } else if (running) {
                buttonsHtml = `<button onclick="stopBot()" id="stopBtn">Stop Bot</button>`;
                statusMessage = '▶️ Trading is active.';
            }

            const controlHtml = `
                <div class="control-panel">
                    <div class="controls">${buttonsHtml}</div>
                    <div class="status-grid">
                        <div class="status-item"><span>Status:</span> <strong>${running ? "Running" : "Stopped"}</strong></div>
                        <div class="status-item"><span>Connected:</span> <strong>${connected ? "Yes" : "No"}</strong></div>
                        <div class="status-item"><span>Ready:</span> <strong>${ready ? "Yes" : "No"}</strong></div>
                    </div>
                    <div class="status-message">${statusMessage}</div>
                </div>
            `;
            document.getElementById('control').innerHTML = controlHtml;
        }

        function fetchStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => updateUI(data))
                .catch(() => {});
        }

        // --- Actions with button disabling ---
        window.connectBot = function() {
            const btn = document.getElementById('connectBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Connecting...';
            }
            fetch('/api/connect', { method: 'POST' })
                .then(() => fetchStatus())
                .finally(() => {
                    // Re-enable after status update
                    setTimeout(fetchStatus, 500);
                });
        };

        window.startBot = function() {
            const btn = document.getElementById('startBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Starting...';
            }
            fetch('/api/start', { method: 'POST' })
                .then(() => fetchStatus())
                .finally(() => {
                    setTimeout(fetchStatus, 500);
                });
        };

        window.stopBot = function() {
            const btn = document.getElementById('stopBtn');
            if (btn) btn.disabled = true;
            fetch('/api/stop', { method: 'POST' })
                .then(() => fetchStatus())
                .finally(() => {
                    if (btn) btn.disabled = false;
                });
        };

        // --- Start polling ---
        fetchStatus();
        setInterval(fetchStatus, POLL_INTERVAL_MS);
    })();
</script>
{% endblock %}

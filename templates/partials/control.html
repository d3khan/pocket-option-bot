<div class="control-panel">
    <div class="controls">
        {% if not connected %}
            <button hx-post="/api/connect" hx-target="#control" hx-swap="outerHTML">Connect</button>
        {% else %}
            <button hx-post="/api/start" hx-target="#control" hx-swap="outerHTML" {% if running %}disabled{% endif %}>Start Bot</button>
            <button hx-post="/api/stop" hx-target="#control" hx-swap="outerHTML" {% if not running %}disabled{% endif %}>Stop Bot</button>
        {% endif %}
    </div>
    <div class="status-grid">
        <div class="status-item"><span>Status:</span> <strong>{{ "Running" if running else "Stopped" }}</strong></div>
        <div class="status-item"><span>Connected:</span> <strong>{{ "Yes" if connected else "No" }}</strong></div>
    </div>
</div>

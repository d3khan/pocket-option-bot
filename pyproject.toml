[project]
name = "pocket-option-bot"
version = "1.0.0"
description = "Real‑time trading bot for Pocket Option with Python‑only WebUI"
authors = [{ name = "d3khan04", email = "d3khan04@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-socketio>=5.11.0",
    "jinja2>=3.1.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "BinaryOptionsToolsV2>=0.1.0",   # Ensure this is available
    "python-dotenv>=1.0.1",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
]
[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W"]
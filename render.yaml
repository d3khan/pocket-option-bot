services:
  - type: web
    name: pocket-option-bot
    runtime: docker
    dockerfilePath: docker/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: PO_SSID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: "INFO"
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
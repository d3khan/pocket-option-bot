services:
  - type: web
    name: pocket-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PO_SSID
        sync: false  # you'll set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
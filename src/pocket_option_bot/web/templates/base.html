<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Bot</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <!-- Custom JS (defines Alpine components) -->
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    <!-- Alpine.js -->
    <script src="https://unpkg.com/alpinejs@3.13.0" defer></script>
    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}?v=4">
    <link rel="icon" href="{{ url_for('static', path='img/icon.png') }}" type="image/png">
    {% block head %}{% endblock %}
</head>
<body>
    <div id="app">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Bot</title>
    <!-- favicon -->
    <link rel="icon" href="{{ url_for('static', path='img/icon.png') }}?v=1" type="image/png">
    <!-- Local HTMX -->
    <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
    <!-- Custom JS (defines Alpine components) -->
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    <!-- Local Alpine.js (load after app.js) -->
    <script src="{{ url_for('static', path='js/cdn.min.js') }}" defer></script>
    <!-- Local Socket.IO client -->
    <script src="{{ url_for('static', path='js/socket.io.min.js') }}" defer></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}?v=2">
    {% block head %}{% endblock %}
</head>
<body>
    <div id="app">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Bot</title><!-- Local HTMX -->
    <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
    <!-- Custom JS (defines Alpine components) -->
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    <!-- Local Alpine.js -->
    <script src="{{ url_for('static', path='js/cdn.min.js') }}" defer></script>
    <!-- Local Socket.IO client -->
    <script src="{{ url_for('static', path='js/socket.io.min.js') }}" defer></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}?v=4">
    <link rel="icon" href="{{ url_for('static', path='img/icon.png') }}" type="image/png">
    {% block head %}{% endblock %}
</head>

<body>
    <div id="app">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
